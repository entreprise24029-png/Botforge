{% extends "base.html" %}
{% block content %}

<div class="result-box">
    {% if success %}
        <h2>✅ تم الدفع بنجاح</h2>
        <p>سيتم تفعيل بوتك خلال دقائق قليلة. يمكنك العودة الآن إلى تليجرام.</p>
    {% else %}
        <h2>❌ تم إلغاء عملية الدفع</h2>
        <p>لم تكتمل عملية الدفع لبوتك رقم #{{ bot_id }}. يمكنك المحاولة مجددًا من داخل تليجرام.</p>
    {% endif %}
</div>

{% endblock %}
